<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>वीर गाथा | 20 महान व्यक्तित्व</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #4b1f08;
        }

        .cover {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #5c2608, #b45f06, #3b1605);
        }

        .book {
            width: 100%;
            max-width: 750px;
            min-height: 900px;
            padding: 55px 30px;
            text-align: center;

            background: linear-gradient(
                135deg,
                #fff3c4,
                #f5d58a,
                #fff0b5
            );

            border: 8px double #8b0000;
            border-radius: 15px;

            box-shadow: 0 15px 45px rgba(0,0,0,0.6);

            position: relative;
        }

        .top {
            font-size: 20px;
            font-weight: bold;
            color: #6b2500;
            letter-spacing: 2px;
            margin-bottom: 50px;
        }

        .title {
            font-size: 75px;
            font-weight: bold;
            color: #8b0000;
            text-shadow: 3px 3px 0 #d4af37;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 25px;
            font-weight: bold;
            color: #4b2108;
            line-height: 1.6;
        }

        .symbol {
            font-size: 100px;
            margin: 55px 0 35px;
        }

        .description {
            max-width: 600px;
            margin: auto;
            font-size: 20px;
            line-height: 1.9;
            color: #4b2a15;
        }

        .author {
            margin-top: 55px;
            font-size: 20px;
            font-weight: bold;
            color: #6b2500;
        }

        .bottom {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            font-size: 16px;
            font-weight: bold;
            color: #6b2500;
        }

        @media (max-width: 600px) {

            .book {
                min-height: 700px;
                padding: 40px 20px;
            }

            .title {
                font-size: 52px;
            }

            .subtitle {
                font-size: 19px;
            }

            .symbol {
                font-size: 75px;
                margin: 40px 0 25px;
            }

            .description {
                font-size: 17px;
            }

            .top {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="cover">

        <div class="book">

            <div class="top">
                ✦ साहस • संघर्ष • त्याग • प्रेरणा ✦
            </div>

            <div class="title">
                वीर गाथा
            </div>

            <div class="subtitle">
                20 महान व्यक्तित्वों की<br>
                प्रेरणादायक जीवन गाथाएँ
            </div>

            <div class="symbol">
                ⚔️
            </div>

            <div class="description">
                उन महान व्यक्तित्वों की प्रेरणादायक कहानियाँ
                जिन्होंने अपने साहस, संघर्ष, त्याग और कर्म से
                इतिहास में अमिट छाप छोड़ी।
            </div>

            <div class="author">
                ✍️ संकलन एवं प्रस्तुति
            </div>

            <div class="bottom">
                © वीर गाथा | डिजिटल संस्करण
            </div>

        </div>

    </div>

</body>
</html>
